<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaStore | E-Commerce Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">Nova<span>Store</span></div>
      <div id="cart-btn" class="cart-btn">
        <span>🛒</span>
        <span>Cart</span>
        <span id="cart-count" class="cart-badge">0</span>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h2>Premium Tech Gear</h2>
    <p>Discover high-quality equipment designed for professionals.</p>
  </header>

  <!-- Main -->
  <main class="container">
    <div class="products-grid" id="products-container">
      <!-- Products will be injected here by JavaScript -->
    </div>
  </main>

  <!-- Cart Overlay -->
  <div class="cart-overlay" id="cart-overlay"></div>

  <!-- Cart Sidebar -->
  <aside class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="close-cart" class="close-cart">✕</button>
    </div>
    <div class="cart-items" id="cart-items-container">
      <p class="empty-cart">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total-price">$0.00</span>
      </div>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
